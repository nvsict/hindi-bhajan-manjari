name: Auto Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Trigger Deployment Script on VPS
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: 22
        script: |
          cd /root/hindi-bhajan-manjari
          git pull origin main
          npm install
          
          # 🌟 CACHE FIX: बिल्ड से पहले कैश क्लियर करें
          rm -rf .next/cache
          
          npm run build
          pm2 reload all