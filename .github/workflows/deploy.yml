name: Auto Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e

            echo "=============================="
            echo "Deploying Hindi Bhajan Manjari"
            echo "=============================="

            cd ~/hindi-bhajan-manjari

            echo "Fetching latest code..."
            git fetch origin

            echo "Cleaning local repository..."
            git reset --hard origin/main
            git clean -fd

            echo "Installing dependencies..."
            npm ci

            echo "Removing old Next.js build..."
            rm -rf .next

            echo "Building application..."
            npm run build

            echo "Restarting PM2..."
            pm2 reload bhajan-manjari --update-env

            echo "Saving PM2..."
            pm2 save

            echo "Deployment completed!"
            pm2 status