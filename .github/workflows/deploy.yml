name: Auto Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e

            cd /root/hindi-bhajan-manjari

            git fetch origin
            git checkout main
            git reset --hard origin/main

            npm ci

            rm -rf .next

            npm run build

            pm2 reload bhajan-manjari --update-env
            pm2 save

            pm2 status