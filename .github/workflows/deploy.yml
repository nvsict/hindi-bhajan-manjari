name: Auto Deploy to VPS (VPS Build Flow)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 1. Checkout Code
        uses: actions/checkout@v4

      - name: 🗜️ 2. Compress Source Code
        # 🌟 FOOLPROOF FIX: ज़िप फ़ाइल को /tmp फोल्डर में बनाकर वापस मूव करना
        # इससे "file changed as we read it" वाला एरर हमेशा के लिए खत्म हो जाएगा
        run: |
          tar -czf /tmp/source.tar.gz --exclude='.git' --exclude='node_modules' .
          mv /tmp/source.tar.gz .

      - name: 🚀 3. Upload Source to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "source.tar.gz"
          target: "~/"

      - name: 🔄 4. Build and Restart on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            
            echo "=============================="
            echo "Deploying Hindi Bhajan Manjari"
            echo "=============================="
            
            # फोल्डर सुनिश्चित करें
            mkdir -p ~/hindi-bhajan-manjari
            
            echo "Extracting new code..."
            tar -xzf ~/source.tar.gz -C ~/hindi-bhajan-manjari
            rm ~/source.tar.gz # सर्वर की मेमोरी खाली करने के लिए ज़िप हटा दें
            
            cd ~/hindi-bhajan-manjari
            
            echo "Installing dependencies..."
            npm ci
            
            echo "Removing old Next.js build..."
            rm -rf .next
            
            echo "Building application on VPS (Using local .env)..."
            npm run build
            
            echo "Restarting PM2..."
            pm2 reload bhajan-manjari --update-env || pm2 start npm --name "bhajan-manjari" -- start
            pm2 save
            
            echo "✅ Deployment completed successfully!"
            pm2 status